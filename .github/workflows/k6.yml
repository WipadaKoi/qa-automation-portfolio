name: k6 Performance Tests

on:
  push:
    branches: [main]
    paths:
      - 'k6-performance/**'
      - '.github/workflows/k6.yml'

  pull_request:
    branches: [main]
    paths:
      - 'k6-performance/**'

  workflow_dispatch:

jobs:
  smoke-test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Smoke Test
        run: k6 run k6-performance/smoke/smoke-test.js